version: 2
# Minor/patch updates only. Major upgrades (AGP, Gradle, Kotlin, GitHub Actions majors) are
# interdependent and are done together in a dedicated "dependency upgrade" work package.
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Kotlin, KSP and AGP must move together with the Compose compiler; upgraded manually.
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "com.google.devtools.ksp*"
      - dependency-name: "com.android.tools.build*"
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.library"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      tooling:
        patterns:
          - "io.gitlab.arturbosch.detekt*"
          - "junit*"
          - "org.jetbrains.kotlinx*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
