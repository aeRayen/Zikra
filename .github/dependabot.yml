version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      kotlin-and-agp:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.android.tools.build*"
          - "com.google.devtools.ksp*"
      androidx:
        patterns:
          - "androidx.*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
