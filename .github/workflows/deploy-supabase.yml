name: Deploy Supabase migrations

# Applies supabase/migrations to the hosted project after they passed CI (pgTAP + lint) and were
# merged. Secrets are set by the owner in GitHub (never in the repository or chat).
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false   # never interrupt a migration half-way

env:
  SUPABASE_PROJECT_REF: lehhajmrmqdghmiilqoe   # public identifier (part of the project URL)

jobs:
  deploy:
    name: Push migrations to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Show pending migrations
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Verify remote matches local
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
