name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read   # gitleaks-action lists PR commits

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid committed env files and keystores
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.jks$|\.keystore$|keystore\.properties$|google-services\.json$' | grep -v '^\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Forbidden files tracked:"; echo "$bad"; exit 1; fi
      - name: Validate JSON files
        run: |
          set -e
          # Pinned third-party sources stay byte for byte as published (some are malformed, e.g. hisnmuslim en/126);
          # they are verified by SHA-256 and parsed by the content pipeline instead.
          for f in $(git ls-files '*.json' ':!content/sources/**'); do python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8-sig'))" "$f" || { echo "Invalid JSON: $f"; exit 1; }; done
      - name: Protect reference starter kit (read-only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}" -- docs/reference/ || true)
          if [ -n "$changed" ]; then echo "docs/reference/ is read-only:"; echo "$changed"; exit 1; fi

  android:
    name: Android build & checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Android project
        id: detect
        run: |
          if [ -f android/gradlew ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No android/ project yet (added in work package 1.2) — skipping."; fi
      - uses: actions/setup-java@v4
        if: steps.detect.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.detect.outputs.present == 'true'
      - name: Build, lint and unit tests
        if: steps.detect.outputs.present == 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease lint test detekt
      # Golden screenshots are recorded on Linux (this runner): font rendering differs on Windows/macOS.
      - name: Verify golden screenshots
        id: screenshots
        if: steps.detect.outputs.present == 'true'
        working-directory: android
        run: ./gradlew --no-daemon verifyRoborazziDebug
      - name: Re-record screenshots on Linux for review (only when they differ)
        if: failure() && steps.screenshots.outcome == 'failure'
        working-directory: android
        run: ./gradlew --no-daemon recordRoborazziDebug
      - name: Upload Linux screenshots for review
        if: failure() && steps.screenshots.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: linux-screenshots
          path: android/**/src/test/screenshots/
          retention-days: 7
      - name: Upload lint/detekt/screenshot reports on failure
        if: failure() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/outputs/roborazzi/
          retention-days: 7

  android-device-tests:
    name: Android device tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Detect device tests
        id: detect
        run: |
          if ls android/*/*/src/androidTest >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      # Runs BEFORE setup-java: the hosted tool cache (JDK) must not be deleted.
      - name: Free disk space (unused toolchains)
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          df -h /
      - uses: actions/setup-java@v4
        if: steps.detect.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.detect.outputs.present == 'true'
      - name: Enable KVM (hardware acceleration for the emulator)
        if: steps.detect.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # SQLCipher (native code) and Android Keystore only exist on a real Android runtime.
      - name: Run device tests on an API 34 emulator
        if: steps.detect.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload device test reports on failure
        if: failure() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: android/**/build/reports/androidTests/
          retention-days: 7

  supabase:
    name: Supabase migrations & RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Supabase project
        id: detect
        run: |
          if [ -f supabase/config.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No supabase/ project yet (added in work package 1.9) — skipping."; fi
      - uses: supabase/setup-cli@v1
        if: steps.detect.outputs.present == 'true'
        with:
          version: 2.121.0
      # Only the database and auth are needed for migrations and RLS tests.
      - name: Start local stack, apply migrations, run tests
        if: steps.detect.outputs.present == 'true'
        run: |
          supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor
          supabase db reset
          supabase test db
          supabase db lint --level error --fail-on error
