name: Configure Supabase Data API

# Sets which schemas the hosted Data API exposes (ADR-024): only "api" (versioned RPC contract).
# Data tables in "app" stay unreachable. Run manually; idempotent.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: lehhajmrmqdghmiilqoe

jobs:
  configure:
    name: Expose only the api schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Update PostgREST settings
        run: |
          curl -sf -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"db_schema":"api","db_extra_search_path":"extensions","max_rows":1000}' > /dev/null
      - name: Show resulting settings
        run: |
          curl -sf "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq '{db_schema, db_extra_search_path, max_rows}'
      # Sign-in by e-mail code (WP 1.12): the e-mail carries a 6-digit code ({{ .Token }}),
      # not a link, so the user types it into the app. Codes expire after 10 minutes.
      - name: Configure e-mail sign-in code
        run: |
          jq -n --arg body "$(cat <<'HTML'
          <div dir="rtl" style="font-family:Tahoma,Arial,sans-serif;font-size:16px;line-height:1.7">
            <p>رمز الدخول إلى تطبيق «ذِكْرَى»:</p>
            <p style="font-size:28px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
            <p>صالح لمدة 10 دقائق. إن لم تطلب هذا الرمز فتجاهل الرسالة.</p>
          </div>
          <hr>
          <div dir="ltr" style="font-family:Arial,sans-serif;font-size:14px;color:#555">
            <p>Your Zikra sign-in code: <b>{{ .Token }}</b> — valid for 10 minutes.
            If you did not request it, ignore this e-mail.</p>
          </div>
          HTML
          )" '{
            mailer_subjects_magic_link: "رمز الدخول إلى ذِكْرَى | Zikra sign-in code",
            mailer_templates_magic_link_content: $body,
            mailer_otp_exp: 600,
            mailer_otp_length: 6
          }' > /tmp/auth.json
          curl -sf -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data-binary @/tmp/auth.json > /dev/null
      - name: Show e-mail sign-in settings
        run: |
          curl -sf "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq '{mailer_subjects_magic_link, mailer_otp_exp, mailer_otp_length, external_email_enabled,
                   has_code_in_template: (.mailer_templates_magic_link_content | contains("{{ .Token }}"))}'
